[package]
name = "extractd"
version = "0.1.0"
edition = "2021"
description = "Lean concurrent HTTP extraction service: fetch -> readability -> markdown"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "gzip",
  "brotli",
  "deflate",
  "zstd",
  "charset",
  "http2",
] }
dom_smoothie = "0.18"
htmd = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
